<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nest</title>
<link rel="stylesheet" href="fonts.css">
<script src="logos.js"></script>
<style>

:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --ink:#000000; --sub:#8A8A8E; --faint:#C7C7CC;
  --line:rgba(60,60,67,.16); --scrim:rgba(0,0,0,.4); --glass:rgba(249,249,249,.85);
  --me:#5B5BD6; --p:#F0508B; --ok:#34C759; --owe:#FF3B30; --accent:#007AFF;
  --shadow:none;
  --r:12px; --tab:64px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.4,.64,1);
}
:root[data-theme=dark]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#FFFFFF; --sub:#8E8E93; --faint:#48484A;
  --line:rgba(84,84,88,.55); --scrim:rgba(0,0,0,.6); --glass:rgba(28,28,30,.85);
  --shadow:none;
  --ok:#30D158; --owe:#FF453A; --accent:#0A84FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",-apple-system,system-ui,Roboto,sans-serif;font-feature-settings:"cv11","ss01","tnum";
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 80% at 50% 0%,#2a2472 0%,#12101f 55%,#0B0B14 100%);color:#fff;transition:opacity .6s var(--ease),transform .6s var(--ease)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .glow{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(70px);opacity:.0;
  background:conic-gradient(from 0deg,#5B5BD6,#F0508B,#5B5BD6);animation:glow 2.4s var(--ease) .1s forwards}
@keyframes glow{to{opacity:.34;transform:rotate(90deg) scale(1)}}
#splash svg{width:132px;height:132px;position:relative;overflow:visible}
#splash .c1{animation:c1 1.1s var(--spring) .15s both}
#splash .c2{animation:c2 1.1s var(--spring) .15s both}
@keyframes c1{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}
@keyframes c2{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
#splash h1{position:relative;font-size:38px;font-weight:700;letter-spacing:-1.2px;margin-top:22px;animation:rise .8s var(--ease) .75s both}
#splash p{position:relative;color:rgba(255,255,255,.66);font-size:16px;margin-top:6px;animation:rise .8s var(--ease) .95s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#splash .made{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38);animation:rise .8s var(--ease) 1.2s both}

/* ---------- main shell ---------- */
#main{flex:1;position:relative;min-height:0}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(var(--tab) + 40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;animation:pg .35s var(--ease)}
@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.large{padding:18px 4px 10px}
.large .eyebrow{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em}
.large h1{font-size:32px;font-weight:700;letter-spacing:-.9px;line-height:1.1;margin-top:2px}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:22px 4px 10px}
.sec h2{font-size:19px;font-weight:700;letter-spacing:-.4px}
.sec button,.link{font-size:14px;font-weight:600;color:var(--accent);padding:6px 2px;min-height:32px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card.flush{padding:0;overflow:hidden}
.muted{color:var(--sub)}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}

/* tab bar */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:1fr 96px 1fr;align-items:center;background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--line)}
#tabbar .t{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:center;font-size:11px;font-weight:600;color:var(--faint);transition:color .2s}
#tabbar .t svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
#tabbar .t.on{color:var(--accent)} #tabbar .t.on svg{transform:translateY(-1px) scale(1.08)}
#tabbar .t:active svg{transform:scale(.88)}
#fab{width:58px;height:58px;border-radius:50%;margin:-26px auto 0;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--me),var(--p));
  box-shadow:0 10px 24px rgba(91,91,214,.45),0 0 0 5px var(--bg);transition:transform .25s var(--spring)}
#fab:active{transform:scale(.92)} #fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}

/* hero balance */
.hero{position:relative;border-radius:28px;padding:22px 20px 18px;color:#fff;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 120% at 0% 0%,#4b43c9 0%,#2a2472 45%,#15122e 100%);box-shadow:0 18px 40px rgba(42,36,114,.35)}
.hero.owed{background:radial-gradient(120% 120% at 0% 0%,#1fa971 0%,#0f6a52 45%,#0a2f2c 100%);box-shadow:0 18px 40px rgba(15,106,82,.32)}
.hero.owe{background:radial-gradient(120% 120% at 0% 0%,#e0457f 0%,#8b2a77 45%,#2a1237 100%);box-shadow:0 18px 40px rgba(139,42,119,.32)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(30px);z-index:-1}
.hero .who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:rgba(255,255,255,.82)}
.hero .big{font-size:48px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:10px 0 4px}
.hero .sub{font-size:14px;color:rgba(255,255,255,.78);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip-d{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.16);font-size:12.5px;font-weight:600}
.hero svg.spark{display:block;width:100%;height:54px;margin-top:14px}
.hero .actions{display:flex;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:15px;font-weight:650;font-size:16px;transition:transform .2s var(--spring),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.glass{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(8px);flex:1}
.btn.white{background:#fff;color:#1b1840;flex:1}
.btn.prime{background:linear-gradient(135deg,var(--me),#7a5af0);color:#fff;box-shadow:0 8px 20px rgba(91,91,214,.35)}
.btn.block{width:100%}
.btn.soft{background:var(--card2);color:var(--ink)}
.btn.danger{background:rgba(229,72,77,.12);color:var(--owe)}
.btn[disabled]{opacity:.38;pointer-events:none;box-shadow:none}
.info{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(255,255,255,.18);font-size:13px;font-weight:700;color:#fff}

/* avatars */
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.av.lg{width:44px;height:44px;font-size:18px}
.av.sm{width:22px;height:22px;font-size:11px}
.pair{display:inline-flex}.pair .av+.av{margin-left:-5px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--sub);font-weight:600}
.tile .v{font-size:23px;font-weight:700;letter-spacing:-.6px;margin-top:6px}
.tile .d{font-size:12.5px;margin-top:3px;color:var(--sub)}

/* stacked bar + legend */
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--card2)}
.stack i{display:block;height:100%;transition:flex-grow .8s var(--ease);flex-basis:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:16px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.legend b{font-weight:650}.legend span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--sub)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* lists */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 16px;min-height:64px;position:relative;transition:background .15s}
.li+.li::before{content:"";position:absolute;left:68px;right:0;top:0;height:1px;background:var(--line)}
.li:active{background:var(--card2)}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}.ico.logo svg{display:block}
.li .mid{flex:1;min-width:0}
.li .t1{font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{font-size:13px;color:var(--sub);margin-top:2px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.li .t2>span:not(.sms):not(.av){min-width:0;overflow:hidden;text-overflow:ellipsis}.li .t2>.sms,.li .t2>.av{flex:none}
.li .amt{text-align:right;font-weight:650;font-size:16px;letter-spacing:-.3px}
.li .amt small{display:block;font-size:12.5px;font-weight:700;margin-top:3px}.pd{width:8px;height:8px;border-radius:50%;flex:none}
.pos{color:var(--ok)}.neg{color:var(--owe)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--sub)}
.sms{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(91,91,214,.12);color:var(--me)}
.dayh{display:flex;align-items:center;justify-content:space-between;padding:20px 6px 8px}
.dayh .l{font-size:14px;font-weight:700}.dayh .l small{font-weight:500;color:var(--sub);margin-left:6px}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--card);box-shadow:var(--shadow)}
.empty{text-align:center;padding:44px 24px;color:var(--sub)}
.empty .big{font-size:44px;margin-bottom:10px}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

/* segmented + chips */
.seg{display:flex;background:var(--card2);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);transition:all .25s var(--ease);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.sm button{font-size:13px;padding:0 3px;white-space:normal;line-height:1.15}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
:root[data-theme=dark] .seg button.on{background:#2b2b3a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--sub);transition:all .2s}
.chip.on{background:var(--ink);color:var(--bg)}

/* month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;padding:4px 0 6px}
.mnav .m{font-size:17px;font-weight:700;letter-spacing:-.3px}
.mnav button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.mnav button[disabled]{opacity:.25}.mnav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* charts */
.donutw{position:relative;width:208px;height:208px;margin:6px auto 4px}
.donutw svg{width:100%;height:100%;transform:rotate(-90deg)}
.donutw circle{fill:none;stroke-width:22;transition:stroke-dasharray 1s var(--ease)}
.donutw .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donutw .ctr small{font-size:12.5px;color:var(--sub);font-weight:600}.donutw .ctr b{font-size:28px;letter-spacing:-1px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s var(--ease)}
.daily{display:flex;align-items:flex-end;gap:3px;height:92px;margin-top:6px}
.daily i{flex:1;min-height:3px;border-radius:4px 4px 2px 2px;background:var(--card2);transition:height .8s var(--ease);height:3px}
.daily i.has{background:linear-gradient(180deg,var(--me),#8d8df0)}.daily i.today{background:linear-gradient(180deg,var(--p),#f79ab9)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px;font-weight:600}
.crow{padding:14px 16px}.crow+.crow{border-top:1px solid var(--line)}
.crow .top{display:flex;align-items:center;gap:12px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.insight+.insight{border-top:1px solid var(--line)}
.insight .e{font-size:22px}.insight p{font-size:14.5px;line-height:1.4}.insight p b{font-weight:700}

/* sheets */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;
  transform:translateY(105%);transition:transform .42s var(--ease);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#sheet.on{transform:none}
#sheet .grab{padding:10px 0 6px;touch-action:none;cursor:grab}
#sheet .grab i{display:block;width:38px;height:5px;border-radius:9px;background:var(--faint);opacity:.5;margin:0 auto}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 10px}
#sheet .sh h3{font-size:20px;font-weight:700;letter-spacing:-.4px}
#sheet .x{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--sub);font-size:16px}
#sheet .body{overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
.field{margin-top:16px}.field>label,.lab{display:block;font-size:12.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:0 4px 8px}
.inp{width:100%;min-height:52px;border-radius:15px;border:1.5px solid transparent;background:var(--card);padding:0 16px;font-size:17px;font-weight:550;outline:none;box-shadow:var(--shadow);transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.amtwrap{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 0 4px}
.amtwrap .cur{font-size:34px;font-weight:600;color:var(--sub)}
.amtwrap input{width:60%;max-width:260px;border:0;background:none;text-align:left;font-size:54px;font-weight:700;letter-spacing:-2px;outline:none;color:var(--ink);min-width:0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:11.5px;font-weight:600;color:var(--sub);border:2px solid transparent;transition:all .2s var(--spring);min-height:70px}
.cat span{font-size:23px}.cat.on{border-color:var(--accent);color:var(--ink);transform:scale(1.04)}
.preview{display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:14.5px;line-height:1.35;margin-top:16px;transition:all .3s}
.preview .e{font-size:22px}
.hint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:10px;min-height:16px}
input[type=range]{width:100%;height:36px;accent-color:var(--accent);margin-top:8px}
.kv{display:flex;justify-content:space-between;padding:13px 0;font-size:15.5px}.kv+.kv{border-top:1px solid var(--line)}.kv span:first-child{color:var(--sub)}.kv b{font-weight:650}
.shares{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.share{border-radius:18px;padding:14px;background:var(--card);box-shadow:var(--shadow)}
.share .n{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--sub)}
.share .v{font-size:22px;font-weight:700;letter-spacing:-.6px;margin-top:8px}.share .p{font-size:12.5px;color:var(--sub)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent;transition:all .2s var(--spring)}
.sw.on{box-shadow:0 0 0 2.5px var(--ink);transform:scale(1.1)}

/* toast */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));z-index:95;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;
  background:#1c1c24;color:#fff;font-size:14.5px;font-weight:550;box-shadow:0 14px 40px rgba(0,0,0,.35);transform:translateY(30px) scale(.96);opacity:0;pointer-events:none;transition:all .4s var(--spring)}
:root[data-theme=dark] #toast{background:#2a2a38}
#toast.on{transform:none;opacity:1;pointer-events:auto}#toast .msg{flex:1}
#toast button{color:#9d9dff;font-weight:700;font-size:15px;padding:6px 4px;min-height:36px}

/* settings */
.set .li{min-height:58px}.set .li .t1{font-weight:550}
.ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none}
.in2{border:0;background:none;outline:none;text-align:right;font-size:16px;font-weight:600;width:55%;color:var(--accent)}
.foot{text-align:center;color:var(--faint);font-size:12.5px;line-height:1.6;padding:26px 0 0}

/* onboarding */
#ob{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
#ob.on{opacity:1;pointer-events:auto}
#ob .stage{flex:1;overflow-y:auto;padding:0 22px;display:flex;flex-direction:column;animation:pg .5s var(--ease)}
#ob .foot2{padding:12px 22px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#ob .dots{display:flex;gap:6px;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 0 4px}
#ob .dots i{width:7px;height:7px;border-radius:9px;background:var(--faint);opacity:.4;transition:all .4s var(--ease)}
#ob .dots i.on{width:22px;background:var(--accent);opacity:1}
.ob-h{font-size:34px;font-weight:700;letter-spacing:-1.2px;line-height:1.08;margin-top:26px}
.ob-p{font-size:16.5px;color:var(--sub);line-height:1.45;margin-top:12px}
.orb{position:relative;width:200px;height:200px;margin:34px auto 0}
.orb i{position:absolute;width:128px;height:128px;border-radius:50%;top:36px;mix-blend-mode:normal}
.orb .a{left:6px;background:radial-gradient(circle at 30% 30%,#8f8fff,#5B5BD6);animation:fl1 5s ease-in-out infinite}
.orb .b{right:6px;background:radial-gradient(circle at 70% 30%,#ff9ab9,#F0508B);opacity:.88;animation:fl2 5s ease-in-out infinite}
@keyframes fl1{50%{transform:translate(8px,-8px)}}@keyframes fl2{50%{transform:translate(-8px,8px)}}
.feat{display:flex;gap:14px;align-items:center;padding:12px 0}
