name: Build SafeGuard APKs
on:
  workflow_dispatch:
  push:
    paths: ['safeguard/**', 'safeguard-guardian/**', '.github/workflows/safeguard-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build SafeGuard (tracked phone) debug APK
        working-directory: safeguard
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PSUPABASE_URL="${SUPABASE_URL}" \
            -PSUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build SafeGuard Guardian debug APK
        working-directory: safeguard-guardian
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PSUPABASE_URL="${SUPABASE_URL}" \
            -PSUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-debug-apks
          path: |
            safeguard/app/build/outputs/apk/debug/*.apk
            safeguard-guardian/app/build/outputs/apk/debug/*.apk

      - name: Commit APKs to dist/
        run: |
          mkdir -p dist
          cp safeguard/app/build/outputs/apk/debug/app-debug.apk dist/SafeGuard.apk
          cp safeguard-guardian/app/build/outputs/apk/debug/app-debug.apk dist/SafeGuardGuardian.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/SafeGuard.apk dist/SafeGuardGuardian.apk
          git commit -m "Add built SafeGuard + SafeGuard Guardian APKs" || exit 0
          git push
