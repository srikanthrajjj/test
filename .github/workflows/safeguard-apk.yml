name: Build SafeGuard APK
on:
  workflow_dispatch:
  push:
    paths: ['safeguard/**', '.github/workflows/safeguard-apk.yml']
    branches-ignore: []
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK
        working-directory: safeguard
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-debug-apk
          path: safeguard/app/build/outputs/apk/debug/*.apk
      - name: Commit APK to dist/
        run: |
          mkdir -p dist
          cp safeguard/app/build/outputs/apk/debug/app-debug.apk dist/SafeGuard.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/SafeGuard.apk
          git commit -m "Add built SafeGuard.apk" || exit 0
          git push
