name: Build SafeGuard APK

on:
  push:
    paths:
      - 'safeguard/**'
      - '.github/workflows/safeguard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safeguard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SafeGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-apk
          path: safeguard/SafeGuard.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: safeguard-${{ github.run_number }}
          name: SafeGuard build ${{ github.run_number }}
          files: safeguard/SafeGuard.apk
