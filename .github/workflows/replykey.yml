name: Build ReplyKey APK

on:
  push:
    paths:
      - 'replykey/**'
      - '.github/workflows/replykey.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replykey
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReplyKey.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReplyKey-apk
          path: replykey/ReplyKey.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: replykey-${{ github.run_number }}
          name: ReplyKey build ${{ github.run_number }}
          files: replykey/ReplyKey.apk
